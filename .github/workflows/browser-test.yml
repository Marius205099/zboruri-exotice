name: Test browser real

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-test.yml"
      - "tools/browser_test.py"

permissions:
  contents: write

concurrency:
  group: browser-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt playwright==1.49.1
      - run: playwright install --with-deps chromium
      - run: python tools/browser_test.py
      - name: Publică raportul
        if: ${{ !cancelled() }}
        run: |
          git config user.name "flight-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results
          git diff --cached --quiet && exit 0
          git commit -m "Raport test browser $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs
          git push
