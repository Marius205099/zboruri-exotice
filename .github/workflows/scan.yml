name: Scanare zboruri

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 ora României (iarna)
    - cron: "0 17 * * *"  # 19:00 ora României (iarna)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Scanează zborurile cu bilet întreg
        run: python scanner/scan.py

      - name: Scanează combinațiile cu oprire 1–2 zile
        run: python scanner/scan_stopover.py

      - name: Salvează rezultatele
        run: |
          git config user.name "flight-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Scanare $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
