name: Scanare zboruri

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 ora României (iarna)
    - cron: "0 17 * * *"  # 19:00 ora României (iarna)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan.yml"
      - "scanner/**"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Scanează zborurile cu bilet întreg
        run: python scanner/scan.py

      - name: Salvează biletele întregi
        run: bash scanner/save_results.sh

      - name: Scanează combinațiile cu oprire 1–2 zile
        run: python scanner/scan_stopover.py

      - name: Salvează combinațiile
        run: bash scanner/save_results.sh
